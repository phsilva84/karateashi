name: Pipeline Karate-Ashi v2.1 (OMR + Engine + Relatórios → Drive)

on:
  schedule:
    - cron: "0 22 * * *"   # diário 22:00 UTC = 19:00 Brasília
  workflow_dispatch:       # disparo manual de 1 clique (sob demanda)

concurrency:
  group: karate-ashi-pipeline
  cancel-in-progress: false

jobs:
  sincronizar-entrada:
    name: Sincronizar Cadastros (rclone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar rclone
        run: |
          curl -sSLo rclone.zip "https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip"
          unzip -o rclone.zip
          sudo cp "rclone-v1.68.2-linux-amd64/rclone" /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone.zip rclone-v1.68.2-linux-amd64

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Pull cadastros do Drive
        run: |
          rclone copy "gdrive:cadastro" data/cadastro/ --transfers 8 || true

      - name: Upload artefato de entrada
        uses: actions/upload-artifact@v4
        with:
          name: dados-entrada
          path: data/cadastro/
          if-no-files-found: warn

  ingestao-omr:
    name: Ingestão OMR (coordenadas + scans do Drive)
    runs-on: ubuntu-latest
    needs: sincronizar-entrada
    outputs:
      tem_folhas: ${{ steps.ingest.outputs.tem_folhas }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar libzbar
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar e configurar rclone
        run: |
          curl -sSLo rclone.zip "https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip"
          unzip -o rclone.zip
          sudo cp "rclone-v1.68.2-linux-amd64/rclone" /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone.zip rclone-v1.68.2-linux-amd64
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Baixar scans do Drive (sem a subpasta processados)
        run: |
          mkdir -p data/scans
          rclone copy "gdrive:scans" data/scans/ \
            --exclude "processados/**" --transfers 8 || true

      - name: Baixar cadastro (artefato de entrada)
        uses: actions/download-artifact@v4
        with:
          name: dados-entrada
          path: data/cadastro/

      - name: Gerar coordenadas das folhas (pre_exame)
        run: |
          export PYTHONPATH=${PYTHONPATH:-}:.
          python - <<'PY'
          import json
          import subprocess
          import sys

          exames = json.load(open('data/exames.json', encoding='utf-8')).get('exames', [])
          cadastro = json.load(open('data/cadastro/alunos.json', encoding='utf-8'))
          por_dojo = {}
          for aluno in cadastro.get('alunos', []):
              dojo = aluno.get('dojo_id')
              por_dojo[dojo] = por_dojo.get(dojo, 0) + 1

          for e in exames:
              if not e.get('gerar_folhas', True):
                  print(f"[INFO] {e['id']}: gerar_folhas=false, pulando")
                  continue
              dojo = e.get('dojo_id')
              if por_dojo.get(dojo, 0) == 0:
                  print(f"[INFO] {e['id']}: sem alunos do {dojo} no cadastro, pulando")
                  continue
              print(f"[INFO] Gerando coordenadas para {e['id']}")
              subprocess.run(
                  [sys.executable, 'tools/pre_exame.py', '--exame', e['id'],
                   '--saida', 'output/pre_exame'],
                  check=True,
              )
          PY

      - name: Ingerir folhas (OMR)
        id: ingest
        run: |
          export PYTHONPATH=${PYTHONPATH:-}:.
          set +e
          python tools/ingest_folhas.py --entrada data/scans --config config \
            --saida output/omr --arquivo output/scans_processados --origem scanner
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "[INFO] Nenhuma imagem para ingerir — OMR ignorado neste run."
          elif [ "$rc" -ne 0 ]; then
            echo "[ERRO] Ingestão falhou (código $rc)."
            exit "$rc"
          fi
          if [ -n "$(ls -A output/omr 2>/dev/null | grep -v resumo_ingestao.json)" ]; then
            echo "tem_folhas=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_folhas=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover scans processados (idempotência persistente no Drive)
        run: |
          rclone move output/scans_processados/ "gdrive:scans/processados/" \
            --transfers 8 || true

      - name: Upload JSONs OMR
        if: steps.ingest.outputs.tem_folhas == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: folhas-omr
          path: output/omr/
          if-no-files-found: warn

  processar-exame:
    name: Processar Exame (OMR → Engine → Relatórios)
    runs-on: ubuntu-latest
    needs: [sincronizar-entrada, ingestao-omr]
    if: needs.ingestao-omr.outputs.tem_folhas == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar dados de entrada
        uses: actions/download-artifact@v4
        with:
          name: dados-entrada
          path: data/cadastro/

      - name: Baixar folhas OMR
        uses: actions/download-artifact@v4
        with:
          name: folhas-omr
          path: output/omr/

      - name: Executar pipeline (gera relatórios + staging; sem upload local)
        run: |
          export PYTHONPATH=${PYTHONPATH:-}:.
          python core/pipeline.py --config config --data data --output output \
            --pasta-omr output/omr --no-drive

      - name: Upload relatórios + staging
        uses: actions/upload-artifact@v4
        with:
          name: distribuicao
          path: output/distribuicao/
          if-no-files-found: warn

  distribuir:
    name: Distribuir Relatórios ao Google Drive (espelha staging)
    runs-on: ubuntu-latest
    needs: processar-exame
    steps:
      - uses: actions/checkout@v4

      - name: Instalar e configurar rclone
        run: |
          curl -sSLo rclone.zip "https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip"
          unzip -o rclone.zip
          sudo cp "rclone-v1.68.2-linux-amd64/rclone" /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone.zip rclone-v1.68.2-linux-amd64
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Baixar staging
        uses: actions/download-artifact@v4
        with:
          name: distribuicao
          path: output/distribuicao/

      - name: Enviar ao Drive (espelha a árvore de staging)
        run: |
          rclone copy output/distribuicao/ \
            "gdrive:documentos/KarateAshi_Exames/relatorios/" --transfers 4 || true