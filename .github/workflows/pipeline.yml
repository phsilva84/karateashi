name: Pipeline Karate-Ashi v2.0 (OMR + Engine + Relatórios)

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 19:00 em Brasília (horário de verão) / 18:00 (padrão)
  workflow_dispatch:       # execução manual (testes e exames especiais)

# Impede dois runs simultâneos — evita corrida de escrita no Google Drive.
concurrency:
  group: karate-ashi-pipeline
  cancel-in-progress: false

jobs:
  # ── Job 1: baixa gabaritos e cadastros do Drive ─────────────────────
  sincronizar-entrada:
    name: Sincronizar Gabaritos e Cadastros (rclone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar rclone (binário)
        run: |
          RCLONE_VERSION=1.68.2
          curl -sSLo rclone.zip "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -o rclone.zip
          sudo cp "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone.zip "rclone-v${RCLONE_VERSION}-linux-amd64"
          rclone version

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Pull gabaritos e cadastros do Drive
        run: |
          rclone copy "gdrive:KarateAshi/gabaritos" data/gabaritos/ --transfers 8
          rclone copy "gdrive:KarateAshi/cadastro" data/cadastro/ --transfers 8

      - name: Upload artefato de entrada
        uses: actions/upload-artifact@v4
        with:
          name: dados-entrada
          path: |
            data/gabaritos/
            data/cadastro/
          if-no-files-found: warn

  # ── Job 1.5: ingestão OMR (scanner + fotos) ─────────────────────────
  ingestao-omr:
    name: Ingestão OMR (scanner + fotos)
    runs-on: ubuntu-latest
    needs: sincronizar-entrada
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de sistema (libzbar)
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar rclone (binário)
        run: |
          RCLONE_VERSION=1.68.2
          curl -sSLo rclone.zip "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -o rclone.zip
          sudo cp "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone.zip "rclone-v${RCLONE_VERSION}-linux-amd64"
          rclone version

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Baixar scans do Drive
        run: |
          mkdir -p data/scans
          rclone copy "gdrive:KarateAshi/scans" data/scans/ --transfers 8 || true

      - name: Ingerir folhas (OMR)
        run: |
          set +e
          python tools/ingest_folhas.py --entrada data/scans --config config \
            --saida output/omr --arquivo data/scans/processados --origem auto
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "[INFO] Nenhuma imagem para ingerir — OMR ignorado neste run."
          elif [ "$rc" -ne 0 ]; then
            echo "[ERRO] Ingestão falhou (código $rc)."
            exit "$rc"
          fi

      - name: Upload JSONs de OMR
        uses: actions/upload-artifact@v4
        with:
          name: folhas-omr
          path: output/omr/
          if-no-files-found: warn

  # ── Job 2: OMR → engine → relatórios (3 camadas, por Dojo) ─────────
  processar-exame:
    name: Processar Exame (OMR → Engine → Relatórios)
    runs-on: ubuntu-latest
    needs: [sincronizar-entrada, ingestao-omr]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar dados de entrada
        uses: actions/download-artifact@v4
        with:
          name: dados-entrada

      - name: Baixar folhas OMR
        uses: actions/download-artifact@v4
        with:
          name: folhas-omr

      - name: Executar pipeline de processamento
        run: python core/pipeline.py --config config --data data --output output

      - name: Upload relatórios gerados
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: output/
          if-no-files-found: error

  # ── Job 3: Telegram (grupo do Dojo / canal dos Mestres) + Drive ─────
  distribuir:
    name: Distribuir Relatórios (Telegram + Drive)
    runs-on: ubuntu-latest
    needs: processar-exame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar relatórios
        uses: actions/download-artifact@v4
        with:
          name: relatorios

      - name: Instalar rclone (binário)
        run: |
          RCLONE_VERSION=1.68.2
          curl -sSLo rclone.zip "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -o rclone.zip
          sudo cp "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone.zip "rclone-v${RCLONE_VERSION}-linux-amd64"
          rclone version

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      # Estado de idempotência vem do Drive (persiste entre runs)
      - name: Baixar estado de notificação do Drive
        run: |
          rclone copy "gdrive:KarateAshi/estado/.ka-notify-state.json" . --transfers 4 || true

      - name: Enviar Telegram e sincronizar Drive
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python core/notifications.py --output output --config config

      # Devolve o estado atualizado para o próximo run
      - name: Persistir estado de notificação no Drive
        run: |
          rclone copy .ka-notify-state.json "gdrive:KarateAshi/estado" --transfers 4 || true