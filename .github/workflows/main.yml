name: Deploy to Google Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          echo "::group::Installing rclone"
          set -x
          curl -fsSL https://rclone.org/install.sh | bash
          echo "::endgroup::"

      - name: Configure rclone
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "::group::Configuring rclone"
          set -x

          # Decode base64 credentials into JSON file
          echo "$GDRIVE_CREDENTIALS" | base64 -d > /tmp/gdrive.json

          # Write rclone.conf with team_drive blank
          cat > /tmp/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive.json
          team_drive = 
          EOF

          echo "rclone.conf created:"
          cat /tmp/rclone.conf
          echo "::endgroup::"

      - name: Copy output to Google Drive
        run: |
          echo "::group::Copying files"
          set -x
          # Check if output directory exists
          if [ ! -d "output" ]; then
            echo "Error: output/ directory not found" >&2
            exit 1
          fi

          if rclone --config /tmp/rclone.conf copy output/ gdrive: --verbose; then
            echo "Copy successful"
          else
            echo "Copy failed" >&2
            exit 1
          fi
          echo "::endgroup::"