name: Upload to Google Drive (Service Account with Personal Drive)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Decode service account credentials
      run: |
        echo "Decoding GDRIVE_CREDENTIALS secret..."
        echo "${{ secrets.GDRIVE_CREDENTIALS }}" | base64 -d > /tmp/credentials.json
        echo "Credentials saved to /tmp/credentials.json"

    - name: Install rclone
      run: |
        sudo apt-get update
        sudo apt-get install -y rclone

    - name: Configure rclone for Google Drive using Service Account
      run: |
        # Create rclone config directory
        mkdir -p ~/.config/rclone

        # Write rclone.conf with drive_type = personal and drive_id
        cat > ~/.config/rclone/rclone.conf << 'EOF'
        [gdrive]
        type = drive
        client_id = 
        client_secret = 
        scope = drive.file
        service_account_file = /tmp/credentials.json
        root_folder_id = 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23
        drive_id = 
        drive_type = personal
        use_drive_id = true
        token = {}
        EOF

        echo "rclone configuration written with drive_type=personal and root_folder_id set"

    - name: Debug - Show rclone config
      run: |
        echo "--- rclone config ---"
        cat ~/.config/rclone/rclone.conf
        echo "---"

    - name: Run Python engine (upload logic)
      env:
        RCLONE_DRIVE_TYPE: personal
        RCLONE_DRIVE_ID: ""
        RCLONE_ROOT_FOLDER_ID: "1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23"
        RCLONE_SERVICE_ACCOUNT_FILE: /tmp/credentials.json
      run: |
        echo "Starting core/engine.py with debug logs..."
        python core/engine.py
        echo "engine.py finished"