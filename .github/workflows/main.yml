name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip rclone
        shell: bash

      - name: Install Python requirements
        run: |
          set -euo pipefail
          pip install -r requirements.txt
        shell: bash

      - name: Run engine
        run: |
          set -euo pipefail
          mkdir -p output
          python core/engine.py
        shell: bash

      - name: Upload output to Google Drive
        run: |
          set -euo pipefail
          # Sincroniza todos os arquivos gerados (JSON e TXT dinâmicos)
          rclone copy output/ gdrive: -v
        shell: bash

      - name: Send Telegram notification with Master Report
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          # Localiza o arquivo master gerado (o mais recente da pasta output)
          MASTER_FILE=$(ls -t output/relatorio_master_dojo_*.txt | head -1)
          
          if [ -f "$MASTER_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document="@$MASTER_FILE" \
              -F caption="Relatório Master do Dojo - Exame Concluído."
          else
            echo "Aviso: Nenhum relatório master encontrado para envio."
          fi
        shell: bash