name: CI Karate-Ashi
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SRE: Garantia de localidade para evitar corrupção de caracteres no log e arquivos
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Configurações do Rclone via Env Vars
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip rclone
          pip install -r requirements.txt

      - name: Run engine
        run: |
          set -euo pipefail
          mkdir -p output
          # SRE: Adiciona a raiz ao PYTHONPATH para que o pacote 'core' seja reconhecido
          export PYTHONPATH=$PYTHONPATH:.
          python core/engine.py
        shell: bash

      - name: Upload to Google Drive
        run: |
          set -euo pipefail
          # SRE: Força o rclone a usar o ID da pasta como destino absoluto via sintaxe inline
          rclone copy output/ "gdrive,root_folder_id=${{ secrets.GDRIVE_ROOT_ID }}:" -v --drive-server-side-across-configs
        shell: bash

      - name: Send Telegram notification
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          # SRE: Localização dinâmica do relatório master mais recente
          MASTER_FILE=$(ls -t output/relatorio_master_dojo_*.txt | head -1)
          
          if [ -f "$MASTER_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document="@$MASTER_FILE" \
              -F caption="🥋 Relatório Master do Dojo - Exame Concluído."
          else
            echo "Aviso: Nenhum relatório master encontrado para envio."
          fi
        shell: bash