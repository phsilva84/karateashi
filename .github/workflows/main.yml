name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        version: latest

    - name: Configure rclone
      run: |
        mkdir -p ~/.config/rclone
        cat > ~/.config/rclone/rclone.conf << EOF
        [gdrive]
        type = drive
        scope = drive
        token = ${{ secrets.GDRIVE_TOKEN }}
        root_folder_id = 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23
        EOF

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run engine
      run: python core/engine.py

    - name: Copy output to Google Drive
      run: rclone copy output/ gdrive: -v

    - name: Send Telegram notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
          -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F document=@"output/relatorio_consolidado.json" \
          -F caption="✅ Pipeline executada com sucesso! Relatório consolidado anexado."
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}