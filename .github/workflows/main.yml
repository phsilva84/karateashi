name: Karate Ashi Automation

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine.py
        run: python core/engine.py

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone with secret
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.GDRIVE_CREDENTIALS }}" > ~/.config/rclone/rclone.conf

      - name: Debug - list generated files
        run: ls -R

      - name: Upload generated files to Google Drive
        run: |
          rclone copy . gdrive:Karate-Ashi --verbose --include "*.pdf" --include "diagnostico.json"
        env:
          RCLONE_CONFIG: ~/.config/rclone/rclone.conf