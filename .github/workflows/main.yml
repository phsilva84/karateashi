name: Correção de dependências
on:
  push:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar rclone
        run: |
          set -euo pipefail
          curl https://rclone.org/install.sh | sudo bash

      - name: Decodificar credenciais e configurar rclone.conf
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_CREDENTIALS" | base64 -d > ~/.config/rclone/rclone.conf
          # Garantir root_folder_id específico
          if ! grep -q "root_folder_id" ~/.config/rclone/rclone.conf; then
            echo "root_folder_id = 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23" >> ~/.config/rclone/rclone.conf
          fi
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}

      - name: Instalar dependências e executar engine
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python core/engine.py
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}