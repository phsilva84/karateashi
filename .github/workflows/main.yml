name: Karate Ashi Automation

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash
    options: -euo pipefail

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Decode service account JSON
        env:
          GDRIVE_SA_B64: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GDRIVE_SA_B64" | base64 -d > /tmp/service-account.json

      - name: Configure rclone
        run: |
          cat > /tmp/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          service_account_file = /tmp/service-account.json
          scope = drive
          root_folder_id = Karate-Ashi
          EOF

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi

      - name: Execute engine
        run: |
          python core/engine.py

      - name: Upload output to Google Drive
        run: |
          rclone --config /tmp/rclone.conf copy output/ gdrive:Karate-Ashi

      - name: Debug - list output
        run: |
          ls -R output/