name: Karate Ashi Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install rclone
      run: |
        curl https://rclone.org/install.sh | sudo bash

    - name: Decode service account credentials
      env:
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      run: |
        echo "$GDRIVE_CREDENTIALS" | base64 -d > /tmp/sa.json

    - name: Configure rclone
      run: |
        cat > /tmp/rclone.conf << 'EOF'
        [gdrive]
        type = drive
        service_account_file = /tmp/sa.json
        EOF

    - name: Run engine
      run: |
        python core/engine.py

    - name: Debug generated file sizes
      run: |
        echo "Generated files before upload:"
        ls -lh output/

    - name: Upload to Google Drive (Karate-Ashi folder)
      run: |
        rclone --config /tmp/rclone.conf copy output/ gdrive:Karate-Ashi -v