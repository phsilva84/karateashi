name: Karate Ashi Workflow

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Write service account credentials safely
        run: |
          printf '%s\n' "$GDRIVE_CREDENTIALS" > /tmp/gdrive-service-account.json
          echo "Credentials written (length: $(wc -c < /tmp/gdrive-service-account.json))"
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}

      - name: Debug - check credentials file
        run: ls -l /tmp/gdrive-service-account.json

      - name: Run engine
        run: python core/engine.py

      - name: Debug - list output folder
        run: ls -R output/ || echo "No output directory"

      - name: Configure rclone for Google Drive
        run: |
          cat > /tmp/rclone.conf << EOF
          [gdrive]
          type = drive
          service_account_file = /tmp/gdrive-service-account.json
          scope = drive.file
          EOF
          echo "rclone config created"

      - name: Upload to Google Drive
        run: rclone copy output/ gdrive:Karate-Ashi --config /tmp/rclone.conf --verbose

      - name: Final debug - list remote if successful
        run: rclone ls gdrive:Karate-Ashi --config /tmp/rclone.conf || echo "Listing failed (possibly empty remote)"