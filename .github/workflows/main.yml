name: CI with Rclone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          echo "Python dependencies installed."

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -sSL https://rclone.org/install.sh | sudo bash
          echo "rclone installed successfully."

      - name: Configure rclone
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<- EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          EOF
          echo "rclone configuration written."

      - name: Run engine
        run: |
          set -euo pipefail
          python core/engine.py
          echo "Engine execution completed."

      - name: Upload to Google Drive
        run: |
          set -euo pipefail
          rclone copy output/ gdrive:Karate-Ashi --config ~/.config/rclone/rclone.conf --verbose
          echo "Upload completed."