name: CI Karate-Ashi
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      GDRIVE_FOLDER_ID: 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip rclone
          pip install -r requirements.txt

      - name: Pull existing reports (Idempotency)
        run: |
          mkdir -p output
          rclone copy gdrive: output/ --drive-root-folder-id "${{ env.GDRIVE_FOLDER_ID }}" -v || echo "Pasta vazia"
        shell: bash

      - name: Run engine
        run: |
          set -euo pipefail
          export PYTHONPATH=${PYTHONPATH:-}:.
          python core/engine.py
        shell: bash

      - name: Upload to Google Drive
        run: |
          set -euo pipefail
          rclone copy output/ gdrive: --drive-root-folder-id "${{ env.GDRIVE_FOLDER_ID }}" -v --drive-server-side-across-configs
        shell: bash

      - name: Send Telegram notification
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MASTER_FILE=$(ls -t output/relatorio_master_dojo_*.txt | head -1)
          if [ -f "$MASTER_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document="@$MASTER_FILE" \
              -F caption="🥋 Relatório Master do Dojo - Exame Concluído."
          fi