name: Karate-Ashi v1.1.4 CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_ID }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          EOF
      - name: Pull existing reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          rclone copy gdrive: output/ --drive-root-folder-id ${{ env.GDRIVE_FOLDER_ID }}
      - name: Run engine
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=${PYTHONPATH:-}:.
          python main.py
      - name: Upload to Google Drive
        shell: bash
        run: |
          set -euo pipefail
          rclone copy output/ gdrive: --drive-root-folder-id ${{ env.GDRIVE_FOLDER_ID }}
      - name: Send Telegram notification
        shell: bash
        run: |
          set -euo pipefail
          LATEST_REPORT=$(ls -t output/*.json | head -n 1 || echo "")
          if [ -f "$LATEST_REPORT" ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument \
              -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -F document=@$LATEST_REPORT \
              -F caption="Karate-Ashi v1.1.4: Relatório gerado com sucesso."
          fi