name: Karate Ashi Automation

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine.py
        run: python engine.py

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone with secret
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          ${{ secrets.GDRIVE_CREDENTIALS }}
          EOF

      - name: Debug - list files recursively
        run: ls -R

      - name: Upload generated content to Google Drive
        run: |
          rclone copy --progress ./ gdrive:Karate-Ashi --include "*.pdf" --include "diagnostico.json"