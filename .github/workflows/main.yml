name: Karate-Ashi v1.1.8 CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [gdrive]
            type = drive
            token = ${{ secrets.GDRIVE_TOKEN }}
            # SRE Fix: Injetando o ID da pasta diretamente na config do remote
            root_folder_id = 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23
          disable_base64: true

      - name: Sync FROM Google Drive (Targeted)
        run: |
          mkdir -p output/
          # Agora o 'gdrive:' ja aponta diretamente para a pasta correta
          rclone copy gdrive: output/ -v

      - name: Run Engine
        run: |
          export PYTHONPATH=${PYTHONPATH:-}:.
          mkdir -p data/processed/
          python core/engine.py

      - name: Sync TO Google Drive (Targeted)
        run: |
          rclone copy output/ gdrive: -v

      - name: Telegram Notification (All Reports)
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Loop para garantir que todos os relatórios gerados sejam enviados
          for file in output/relatorio_master_dojo_*.txt; do
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document="@$file" \
              -F caption="🥋 Relatório Master: $(basename $file)"
          done