name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip rclone
        shell: bash

      - name: Install Python requirements
        run: |
          set -euo pipefail
          pip install -r requirements.txt
        shell: bash

      - name: Run engine
        run: |
          set -euo pipefail
          python core/engine.py
        shell: bash

      - name: Upload output to Google Drive
        run: |
          set -euo pipefail
          rclone copy output/ gdrive: -v
        shell: bash

      - name: Send Telegram notification with report
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT_ID}" \
            -F document="@output/relatorio_consolidado.json" \
            -F caption="Workflow concluído com sucesso."
        shell: bash