name: Karate-Ashi v1.2.2 CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [gdrive]
            type = drive
            token = ${{ secrets.GDRIVE_TOKEN }}
            root_folder_id = 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23
          disable_base64: true

      - name: Sync FROM Google Drive (Checksums)
        run: |
          mkdir -p output/
          rclone copy gdrive: output/ -v

      - name: Run Engine
        run: |
          export PYTHONPATH=${PYTHONPATH:-}:.
          mkdir -p data/processed/
          python core/engine.py

      - name: Sync TO Google Drive
        run: |
          rclone copy output/ gdrive: -v

      - name: Telegram Notification (Manifesto Loop)
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "output/.files_to_send" ]; then
            echo "Arquivos novos detectados. Iniciando disparos..."
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                  -F chat_id="${TG_CHAT_ID}" \
                  -F document="@$file" \
                  -F caption="🥋 Relatorio Master Atualizado: $(basename $file)"
              fi
            done < "output/.files_to_send"
          else
            echo "Nenhuma alteracao real detectada. Telegram em silencio."
          fi