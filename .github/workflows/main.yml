name: Karate Ashi Automation
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: curl -sSL https://rclone.org/install.sh | sudo bash
      - name: Decode service account JSON
        run: echo "${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}" | base64 -d > /tmp/service-account.json
      - name: Configure rclone
        run: |
          cat > /tmp/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/service-account.json
          EOF
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run core engine
        run: python core/engine.py
      - name: Upload output to Google Drive
        run: rclone copy output/ gdrive:Karate-Ashi --config /tmp/rclone.conf