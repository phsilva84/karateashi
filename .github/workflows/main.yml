name: KarateAshi Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Verify rclone installation
        run: rclone version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run engine
        run: python core/engine.py

      - name: Write service account JSON safely using printf
        run: |
          printf '%s\n' "${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}" > /tmp/service-account.json

      - name: Configure rclone with service account
        run: |
          cat > /tmp/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/service-account.json
          EOF

      - name: Upload output/ to Google Drive (Karate-Ashi)
        run: |
          rclone --config /tmp/rclone.conf copy output/ gdrive:Karate-Ashi

      - name: Debug - list output files
        run: ls -R output/