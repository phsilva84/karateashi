name: Karate Ashi Workflow
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Decode GDrive credentials
        run: |
          set -euo pipefail
          echo "${{ secrets.GDRIVE_CREDENTIALS }}" | base64 -d > /tmp/rclone.conf

      - name: Run engine
        run: |
          set -euo pipefail
          python core/engine.py

      - name: Upload output to Google Drive
        run: |
          set -euo pipefail
          rclone copy output/ gdrive:Karate-Ashi --config /tmp/rclone.conf