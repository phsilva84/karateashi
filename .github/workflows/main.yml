name: CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          root_folder_id = 1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies and run engine
        run: |
          pip install -r requirements.txt
          python core/engine.py

      - name: Debug directory listings
        run: |
          echo "=== data/ ==="
          ls -R data/
          echo "=== output/ ==="
          ls -R output/

      - name: Upload output to Google Drive
        run: |
          rclone -v copy output/ gdrive: