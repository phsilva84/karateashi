name: Main Workflow

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true

    - name: Run engine
      run: python core/engine.py

    - name: Debug: list output files
      run: |
        set -euo pipefail
        echo "Listing output files:"
        ls -la output/ || echo "No output directory"
        echo "Debug complete"

    - name: Telegram notification
      run: |
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="Workflow executado com sucesso."

    - name: Rclone sync (OAuth2)
      run: |
        rclone sync output/ remote:backup --config rclone.conf || echo "Rclone sync failed"