name: Karate Ashi Automation

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || { echo "Failed to install dependencies"; exit 1; }

      - name: Run core engine
        run: |
          python core/engine.py || { echo "Engine execution failed"; exit 1; }

      - name: Verify output file
        run: |
          if [ ! -f output/diagnostico.json ]; then
            echo "Missing output/diagnostico.json"
            exit 1
          fi
          echo "Diagnostico file exists"

      - name: Debug listing before upload
        run: ls -R output/

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone || { echo "rclone installation failed"; exit 1; }

      - name: Configure rclone
        run: |
          echo "${{ secrets.GDRIVE_CREDENTIALS }}" > /tmp/gdrive-credentials.json || { echo "Failed to write credentials"; exit 1; }
          cat > /tmp/rclone.conf << EOF
          [gdrive]
          type = drive
          service_account_file = /tmp/gdrive-credentials.json
          scope = drive
          root_folder_id = 
          EOF
          echo "rclone configuration created"

      - name: Upload to Google Drive
        run: |
          rclone --config /tmp/rclone.conf copy output/ gdrive:Karate-Ashi || { echo "Upload failed"; exit 1; }

      - name: Debug listing after upload
        run: ls -R output/