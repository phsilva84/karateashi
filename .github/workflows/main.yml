name: Karate Ashi Automation
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Decode Credentials
        run: |
          echo "${{ secrets.GDRIVE_CREDENTIALS }}" | base64 -d > /tmp/sa.json

      - name: Configure rclone
        run: |
          cat > /tmp/rclone.conf << EOF
          [gdrive]
          type = drive
          service_account_file = /tmp/sa.json
          scope = drive
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Engine
        run: |
          pip install -r requirements.txt
          python core/engine.py

      - name: Upload Direct to Folder ID
        run: |
          # Usamos o ID da pasta diretamente no destino do comando
          rclone --config /tmp/rclone.conf copy output/ gdrive,root_folder_id=1aFwAcB7bC7sy2VZs27cpAllE7-ZvcS23: -v