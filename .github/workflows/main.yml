name: Karate-Ashi v1.1.8 CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [gdrive]
            type = drive
            token = ${{ secrets.GDRIVE_TOKEN }}
          disable_base64: true

      - name: Sync FROM Google Drive
        run: |
          mkdir -p output/
          # Usando o segredo GDRIVE_TOKEN para o config e o ID da pasta se necessário
          rclone copy gdrive: output/ --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" -v

      - name: Run Engine
        run: |
          export PYTHONPATH=${PYTHONPATH:-}:.
          mkdir -p data/processed/
          python core/engine.py

      - name: Sync TO Google Drive
        run: |
          rclone copy output/ gdrive: --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" -v

      - name: Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MASTER_FILE=$(ls -t output/relatorio_master_dojo_*.txt | head -1)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT_ID}" \
            -F document="@$MASTER_FILE" \
            -F caption="🥋 Relatório Master do Dojo Processado."