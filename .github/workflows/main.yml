name: Consolidated Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          echo "::debug::Installing rclone via official script"
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb
          rclone version

      - name: Configure rclone
        run: |
          set -euo pipefail
          echo "::debug::Creating rclone.conf with GDRIVE token"
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          EOF

      - name: Install Python dependencies and run engine
        run: |
          set -euo pipefail
          echo "::debug::Installing Python dependencies"
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          echo "::debug::Running core/engine.py"
          python core/engine.py

      - name: Upload output to Google Drive
        run: |
          set -euo pipefail
          echo "::debug::Uploading output/ to gdrive:Karate-Ashi"
          rclone copy output/ gdrive:Karate-Ashi --config ~/.config/rclone/rclone.conf --verbose